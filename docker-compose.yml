services:
  resumable-api:
    build: .
    image: resumable-upload-api:latest
    container_name: resumable-upload-api
    ports:
      - "8000:8000"
    environment:
      # 所有配置项均有默认值，以下为示例覆盖。
      DATA_DIR: /data
      SESSION_TTL_SECONDS: "86400"
      CLEANUP_INTERVAL_SECONDS: "300"
      MAX_CHUNK_BYTES: "67108864"
      MAX_UPLOAD_BYTES: "107374182400"
    volumes:
      - resumable-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  resumable-data:
